<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>ARGOS // OSINT Core</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/mobile.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Terminal Header -->
  <header class="app-header">
    <div class="brand-wrapper">
      <div class="brand-logo-dot"></div>
      <div class="brand-title">ARGOS // OSINT</div>
      <div class="brand-meta">SYS_V3.3</div>
    </div>

    <!-- Desktop nav tabs (hidden on mobile via mobile.css) -->
    <nav class="nav-tabs">
      <button class="nav-tab-btn active" data-target="view-recon">Target Recon</button>
      <button class="nav-tab-btn" data-target="view-graph">Relationship Graph</button>
      <button class="nav-tab-btn" data-target="view-history">Intelligence Dossiers</button>
    </nav>

    <div style="display:flex;align-items:center;gap:14px;">
      <!-- AI status visible in header on desktop only -->
      <div id="ai-global-status" style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);cursor:pointer;">
        <span id="ai-status-text">AI CORE: CHECKING...</span>
      </div>
      <button id="btn-open-settings" class="btn-terminal-action" title="Configure System Settings">[SETTINGS]</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-container">
    <!-- 1. TARGET RECON VIEW -->
    <section id="view-recon" class="view-section active">
      <!-- Target Input Module -->
      <div class="terminal-card">
        <div class="card-header-row">
          <span class="terminal-section-title">Reconnaissance Matrix</span>
          <span id="collision-mode-badge" class="terminal-status-indicator">ENGINE ONLINE</span>
        </div>

        <form id="scan-form">
          <div class="grid-inputs">
            <div class="input-group">
              <label class="input-label" for="input-username">Username(s) / List</label>
              <input type="text" id="input-username" class="form-input" placeholder="e.g. jdoe, target2" autocomplete="off">
            </div>

            <div class="input-group">
              <label class="input-label" for="input-name">Known Names / Aliases</label>
              <input type="text" id="input-name" class="form-input" placeholder="e.g. John Doe" autocomplete="off">
            </div>

            <div class="input-group">
              <label class="input-label" for="input-location">Location / Country</label>
              <input type="text" id="input-location" class="form-input" placeholder="e.g. United States, United Kingdom" autocomplete="off">
            </div>

            <div class="input-group">
              <label class="input-label" for="input-phone">Phone Number</label>
              <input type="text" id="input-phone" class="form-input" placeholder="+1234567890" autocomplete="off">
            </div>

            <div class="input-group">
              <label class="input-label" for="input-email">Email Address</label>
              <input type="email" id="input-email" class="form-input" placeholder="target@domain.com" autocomplete="off">
            </div>
          </div>

          <!-- Permutation Counter -->
          <div id="permutation-preview-bar" class="permutation-bar"></div>

          <!-- AI status inline (mobile only — shown via mobile.css) -->
          <div id="ai-status-mobile"></div>

          <!-- Options & Execute -->
          <div class="options-row">
            <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;">
              <label class="checkbox-label">
                <input type="checkbox" id="chk-fuzzy" checked>
                <span>Enable Delimiter &amp; Syllable Permutations</span>
              </label>

              <label class="checkbox-label">
                <input type="checkbox" id="chk-digits">
                <span>Enable Numeric &amp; Digit Collision Permutations</span>
              </label>

              <button type="button" id="btn-find-with-face" class="btn-terminal-action btn-find-face">[FIND WITH FACE]</button>
              <input type="file" id="input-face-photo" accept="image/*" style="display:none;">
              <div id="face-seed-preview" class="face-seed-preview" style="display:none;">
                <img id="face-seed-thumb" alt="">
                <span id="face-seed-filename"></span>
                <span id="face-seed-status" class="face-seed-status"></span>
                <button type="button" id="btn-clear-face-seed" class="btn-terminal-action" title="Remove">[X]</button>
              </div>
            </div>

            <button type="submit" id="btn-start-scan" class="btn-launch-scan">
              Execute Probe
            </button>
          </div>
        </form>
      </div>

      <!-- Scan Progress -->
      <div id="progress-panel" class="progress-panel">
        <div class="progress-header">
          <span id="progress-detail">Initializing probe matrix...</span>
          <div style="display:flex;align-items:center;gap:12px;">
            <span id="progress-percent" style="color:#ffffff;">0%</span>
            <button type="button" id="btn-dismiss-scan" class="btn-terminal-action">[DISMISS]</button>
          </div>
        </div>
        <div class="progress-bar-bg">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
      </div>

      <!-- AI Synthesis Module -->
      <div id="ai-briefing-card" class="briefing-card" style="display:none;">
        <div class="card-header-row">
          <span class="terminal-section-title">Intelligence Synthesis</span>
          <span id="briefing-confidence-badge" class="terminal-status-indicator">CONFIDENCE: 95%</span>
        </div>
        <div id="briefing-text" class="briefing-text"></div>
        <div class="briefing-meta-row">
          <span id="briefing-identity-tag">IDENTITY: INFERRED</span>
          <span id="briefing-rationale"></span>
        </div>
      </div>

      <!-- Results Header & Category Filter -->
      <div class="card-header-row" style="margin-top:8px;margin-bottom:0;">
        <div style="display:flex;align-items:center;gap:12px;">
          <span id="findings-count" class="terminal-section-title">0 DISCOVERED</span>
          <button type="button" id="btn-reset-results" class="btn-terminal-action" style="display:none;">Reset</button>
        </div>

        <div id="filter-row" class="filter-row">
          <button class="filter-chip active" data-filter="all">All</button>
          <button class="filter-chip" data-filter="exact">Exact</button>
          <button class="filter-chip" data-filter="email_pivot">Email Linked</button>
          <button class="filter-chip" data-filter="breaches">Breaches</button>
          <button class="filter-chip" data-filter="faces">Faces</button>
          <button class="filter-chip" data-filter="Social">Social</button>
          <button class="filter-chip" data-filter="Developer">Developer</button>
          <button class="filter-chip" data-filter="Gaming">Gaming</button>
          <button class="filter-chip" data-filter="Media">Media</button>
          <button class="filter-chip" data-filter="permutation">Permutations</button>
        </div>
      </div>

      <!-- Sub-Filter Bar -->
      <div id="sub-filter-row" class="sub-filter-row" style="display:none;"></div>

      <!-- Findings Grid -->
      <div id="results-grid" class="results-grid"></div>
    </section>

    <!-- 2. RELATIONSHIP GRAPH VIEW -->
    <section id="view-graph" class="view-section" style="display:none;height:calc(100vh - 100px);flex-direction:column;">
      <div class="graph-toolbar">
        <div class="filter-row" id="graph-category-filters">
          <button class="filter-chip active" data-graph-cat="all">All</button>
          <button class="filter-chip" data-graph-cat="exact">Exact</button>
          <button class="filter-chip" data-graph-cat="email_pivot">Email Linked</button>
          <button class="filter-chip" data-graph-cat="Social">Social</button>
          <button class="filter-chip" data-graph-cat="Developer">Developer</button>
          <button class="filter-chip" data-graph-cat="Gaming">Gaming</button>
          <button class="filter-chip" data-graph-cat="Media">Media</button>
        </div>

        <div style="display:flex;align-items:center;gap:8px;">
          <input type="text" id="graph-search-input" class="form-input" placeholder="Search node..." style="padding:4px 8px;font-size:11px;width:160px;">
          <button id="btn-graph-zoom-in" class="btn-terminal-action">[+]</button>
          <button id="btn-graph-zoom-out" class="btn-terminal-action">[-]</button>
          <button id="btn-graph-recenter" class="btn-terminal-action">[CENTER]</button>
          <button id="btn-graph-freeze" class="btn-terminal-action">[FREEZE]</button>
        </div>
      </div>

      <div id="graph-platform-sub-filters" class="sub-filter-row" style="display:none;margin-top:4px;margin-bottom:4px;"></div>

      <div class="graph-container">
        <canvas id="graphCanvas"></canvas>
      </div>
    </section>

    <!-- 3. INTELLIGENCE DOSSIERS HISTORY VIEW -->
    <section id="view-history" class="view-section" style="display:none;">
      <div class="terminal-card">
        <div class="card-header-row">
          <span class="terminal-section-title">Stored Intelligence Dossiers</span>
        </div>
        <table style="width:100%;border-collapse:collapse;font-size:11px;font-family:var(--font-mono);">
          <thead>
            <tr style="border-bottom:1px solid var(--border-subtle);text-align:left;color:var(--text-muted);">
              <th style="padding:10px 8px;">TARGET</th>
              <th style="padding:10px 8px;">SEED IDENTIFIER</th>
              <th style="padding:10px 8px;">CONFIDENCE</th>
              <th style="padding:10px 8px;">PROFILES</th>
              <th style="padding:10px 8px;">TIMESTAMP</th>
            </tr>
          </thead>
          <tbody id="history-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div class="card-header-row">
        <span class="terminal-section-title">Engine Configuration</span>
        <button id="btn-close-settings" class="btn-terminal-action">[CLOSE]</button>
      </div>

      <form id="settings-form">
        <div style="display:flex;flex-direction:column;gap:14px;">
          <div class="input-group">
            <label class="input-label">AI Inference Provider</label>
            <select id="setting-provider" class="form-input">
              <option value="groq">Groq Cloud API (Ultra-Fast Free Tier)</option>
              <option value="local">Local Inference (Ollama / LM Studio / llama.cpp)</option>
            </select>
          </div>

          <div class="input-group" id="group-api-key">
            <label class="input-label">Groq API Key</label>
            <input type="text" id="setting-api-key" class="form-input" placeholder="gsk_..." autocomplete="off" spellcheck="false">
          </div>

          <div class="input-group" id="group-ollama-host" style="display:none;">
            <label class="input-label">Local Host Endpoint</label>
            <select id="setting-host-preset" class="form-input" style="margin-bottom:6px;">
              <option value="http://127.0.0.1:11434">Ollama Default (Port 11434)</option>
              <option value="http://127.0.0.1:1234">LM Studio Default (Port 1234)</option>
              <option value="http://127.0.0.1:8080">llama.cpp / Kobold (Port 8080)</option>
              <option value="custom">Custom Endpoint...</option>
            </select>
            <input type="text" id="setting-host" class="form-input" value="http://127.0.0.1:11434">
          </div>

          <div class="input-group">
            <label class="input-label">Inference Model</label>
            <select id="setting-model-select" class="form-input"></select>
          </div>

          <label class="checkbox-label" style="margin-top:4px;">
            <input type="checkbox" id="setting-enable-ai" checked>
            <span>Enable AI Context Synthesis &amp; Executive Briefings</span>
          </label>

          <div id="test-status-box" style="display:none;font-family:var(--font-mono);font-size:11px;padding:8px 10px;background:var(--bg-input);border:1px solid var(--border-subtle);"></div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:12px;border-top:1px solid var(--border-subtle);">
            <button type="button" id="btn-test-ai" class="btn-terminal-action">[TEST CONNECTION]</button>
            <button type="submit" class="btn-launch-scan">SAVE CONFIG</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Bottom Navigation Bar (mobile only — shown via mobile.css) -->
  <!-- Graph tab intentionally omitted from mobile nav per user request -->
  <nav class="bottom-nav" aria-label="Primary navigation">
    <button class="bottom-nav-btn active" data-target="view-recon" aria-label="Target Recon">
      <!-- Crosshair / target icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <circle cx="12" cy="12" r="3"/>
        <line x1="12" y1="3" x2="12" y2="6"/>
        <line x1="12" y1="18" x2="12" y2="21"/>
        <line x1="3" y1="12" x2="6" y2="12"/>
        <line x1="18" y1="12" x2="21" y2="12"/>
      </svg>
      Recon
    </button>

    <button class="bottom-nav-btn" data-target="view-history" aria-label="Intelligence Dossiers">
      <!-- File / dossier icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="8" y1="13" x2="16" y2="13"/>
        <line x1="8" y1="17" x2="13" y2="17"/>
      </svg>
      Dossiers
    </button>
  </nav>

  <script src="/static/js/graph.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
