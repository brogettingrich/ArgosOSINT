<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>ArgosOSINT | Multi-Target Reconnaissance</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-wrapper">
      <div class="brand-logo"></div>
      <div class="brand-title">ARGOS<span style="color:var(--text-secondary);font-weight:400;">OSINT</span></div>
      <span class="brand-badge">PRECISION PROBE ENGINE</span>
    </div>
    <nav class="nav-tabs">
      <button class="nav-tab-btn active" data-target="view-scanner">Scanner</button>
      <button class="nav-tab-btn" data-target="view-graph">Relationship Graph</button>
      <button class="nav-tab-btn" data-target="view-history">Dossiers</button>
    </nav>
  </header>

  <main class="main-container">
    <!-- VIEW: SCANNER -->
    <section id="view-scanner" class="view-section">
      <div class="search-card">
        <div class="card-header-row">
          <div class="card-title">Target Intelligence Parameters</div>
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">MULTI_ALIAS_ACTIVE</div>
        </div>

        <form id="scan-form">
          <div class="grid-inputs">
            <div class="input-group">
              <label class="input-label">Username / Handle</label>
              <input type="text" id="input-username" class="form-input" placeholder="e.g. account_loading, elonmusk">
            </div>
            <div class="input-group">
              <label class="input-label">Known Names / Aliases (Comma-Separated)</label>
              <input type="text" id="input-name" class="form-input" placeholder="e.g. Name1, Name2, Alias3">
            </div>
            <div class="input-group">
              <label class="input-label">Email Address (Optional)</label>
              <input type="email" id="input-email" class="form-input" placeholder="target@domain.com">
            </div>
            <div class="input-group">
              <label class="input-label">Phone Number (Optional)</label>
              <input type="text" id="input-phone" class="form-input" placeholder="+1 555-0199">
            </div>
          </div>

          <div class="permutation-bar" id="permutation-preview-bar"></div>

          <div class="options-row">
            <label class="checkbox-label">
              <input type="checkbox" id="chk-fuzzy">
              <span>Enable Full Permutations (Trailing letter doubling like loadingg, separator swaps, and typo matrix)</span>
            </label>
            <button type="submit" class="btn-launch-scan">
              <span>Launch Recon Probe</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Live Telemetry & Progress -->
      <div class="progress-panel" id="progress-panel">
        <div class="progress-header">
          <span id="progress-detail">Initializing probe stream...</span>
          <div style="display:flex;align-items:center;gap:12px;">
            <span id="progress-percent">0%</span>
            <button id="btn-dismiss-scan" class="btn-dismiss-link" title="Dismiss Session">Dismiss</button>
          </div>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
      </div>

      <!-- Results Header & Actions -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;">
        <h3 id="findings-count" style="font-size:15px;font-weight:600;">Discovered Accounts</h3>
        <div style="display:flex;gap:8px;">
          <button id="btn-reset-results" class="btn-profile-link" style="padding:4px 10px;font-size:11px;display:none;">Reset Grid</button>
          <button id="btn-export-json" class="btn-profile-link" style="padding:4px 10px;font-size:11px;">Export JSON</button>
          <button id="btn-export-html" class="btn-profile-link" style="padding:4px 10px;font-size:11px;">Export HTML</button>
        </div>
      </div>

      <!-- Category Filter Tabs -->
      <div class="filter-row" id="filter-row" style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="exact">Exact Matches</button>
        <button class="filter-chip" data-filter="permutation">Permutations</button>
        <button class="filter-chip" data-filter="Social">Social</button>
        <button class="filter-chip" data-filter="Developer">Developer</button>
        <button class="filter-chip" data-filter="Gaming">Gaming</button>
        <button class="filter-chip" data-filter="Media">Media</button>
      </div>

      <!-- Dynamic Sub-Platform Filter Bar (e.g. inside Social: Instagram, TikTok, YouTube, etc.) -->
      <div class="sub-filter-row" id="sub-filter-row" style="display:none;"></div>

      <div class="results-grid" id="results-grid"></div>
    </section>

    <!-- VIEW: RELATIONSHIP GRAPH -->
    <section id="view-graph" class="view-section" style="display: none;">
      <div class="card-header-row">
        <div class="card-title">Interactive Target Relationship Graph</div>
        <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">FORCE_DIRECTED_PHYSICS</div>
      </div>
      <div class="graph-container">
        <canvas id="graphCanvas"></canvas>
      </div>
    </section>

    <!-- VIEW: HISTORY -->
    <section id="view-history" class="view-section" style="display: none;">
      <div class="card-header-row">
        <div class="card-title">Recorded Target Dossiers</div>
      </div>
      <table class="history-table">
        <thead>
          <tr><th>Target</th><th>Seed Parameter</th><th>Findings</th><th>Timestamp</th></tr>
        </thead>
        <tbody id="history-tbody"></tbody>
      </table>
    </section>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/graph.js"></script>
  <script src="/static/js/export.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
